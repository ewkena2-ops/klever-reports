<meta charset="utf-8">
<script>
/* The door QR (?scan=office) goes to the quick check-in page, before anything
   else here loads (26 Oct 2026: "when they scan, the site has to load
   faster"). It sends back here, with full=1, whoever it cannot check in alone. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (/^(office|1)$/.test(q.get('scan') || '') && q.get('full') !== '1') {
      location.replace('scan.html' + location.search + location.hash);
      /* and nothing below is read, fetched or run meanwhile */
      document.write('<plaintext style="display:none">');
    }
  } catch (e) {}
})();
</script>
