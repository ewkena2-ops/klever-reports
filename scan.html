<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klever check-in</title>
<meta name="description" content="Office check-in at the Klever Küche door.">
<meta name="theme-color" content="#0f5c54">
<link rel="icon" href="assets/icon.svg?v=9fd7999d" type="image/svg+xml">
<link rel="icon" href="assets/icon-32.png?v=e7a77e05" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=f7591a12">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css?v=1de8f4d7">
<style>
  .scanwrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  .scanhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .scanhead img{height:30px;width:auto}
  .scanhead h1{font:700 18px var(--sans);margin:0;color:var(--ink)}
  .scanlinks{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
  .scanlinks a{display:inline-flex;align-items:center;text-decoration:none}
</style>
</head>
<body data-page="scan">
<!-- The door QR opens index.html?scan=office, which comes straight here
     (26 Oct 2026, the user: "when they scan, the site has to load faster"):
     sign-in and the phone's location only — not the whole site. -->
<main class="scanwrap">
  <div class="scanhead"><img src="assets/logo.png" alt="Klever Küche"><h1 id="scantitle">Office check-in</h1></div>
  <div id="scanbox" class="ins atscan wait"><div class="inst">Checking you in…</div></div>
  <div id="scanlinks" class="scanlinks"></div>
</main>
<script src="js/i18n.js?v=8ac376f3"></script>
<script src="js/firebase-config.js?v=8a080f41"></script>
<script src="js/where.js?v=b18f6a59"></script>
<script src="js/scan.js?v=3bc2e102"></script>
</body>
</html>
